<text x="360" y="583" text-anchor="end" font-size="11" font-weight="700" fill="#554f48">1. SCOUT</text>
<text x="48" y="608" font-size="11.5" fill="#453f3b">Answers numbered questions with</text>
<text x="48" y="626" font-size="11.5" fill="#453f3b">evidence in a timed check-in box</text>
