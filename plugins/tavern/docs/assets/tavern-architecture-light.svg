<text x="712" y="583" text-anchor="end" font-size="11" font-weight="700" fill="#554f48">2. BUILD</text>
<text x="400" y="608" font-size="11.5" fill="#453f3b">Edits on a branch, commits work,</text>
<text x="400" y="626" font-size="11.5" fill="#453f3b">runs checks, opens draft PRs</text>
