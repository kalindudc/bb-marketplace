<text x="36" y="817" font-size="12" font-weight="700" fill="#a53b05" letter-spacing="0.5">SCOPES AND GUARDRAILS</text>
<text x="36" y="846" font-size="11.5" fill="#282828">■ Pi guard shim: pre-exec and OS sandbox</text>
<text x="36" y="866" font-size="11.5" fill="#453f3b">■ Non-Pi or remote: detection-only watch</text>
<text x="36" y="886" font-size="11.5" fill="#453f3b">■ Send guard: agents draft, you send</text>
<text x="36" y="906" font-size="11.5" fill="#453f3b">■ Cluster writes: approve then confirm</text>
<text x="36" y="926" font-size="11.5" fill="#453f3b">■ Policy: ~/.agents/tavern/scopes.yml</text>
