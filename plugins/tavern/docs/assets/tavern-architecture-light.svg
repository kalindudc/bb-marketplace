<g transform="translate(48,570) scale(1.0000)"><path d="M23 1.5l-4.25 8l4.25 8h-18.5v6h-2.75v-23h2.75v1z" fill="#076678" stroke="#282828" stroke-width="1.6" stroke-linejoin="miter"/></g>
