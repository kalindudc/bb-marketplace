<text x="400" y="817" font-size="12" font-weight="700" fill="#883a6b" letter-spacing="0.5">WHERE WORK RUNS · HOST WORKER</text>
<text x="400" y="846" font-size="11.5" fill="#282828">■ Local linked git worktrees by default</text>
<text x="400" y="866" font-size="11.5" fill="#453f3b">■ Machine rules place work on bb hosts</text>
<text x="400" y="886" font-size="11.5" fill="#453f3b">■ Clean Git snapshots (home untouched)</text>
<text x="400" y="906" font-size="11.5" fill="#453f3b">■ Forge profiles open draft PRs at home</text>
<text x="400" y="926" font-size="11.5" fill="#453f3b">■ Work preserved before member release</text>
