<text x="76" y="47" font-size="18" font-weight="700" fill="#282828" letter-spacing="0.5">TAVERN</text>
<text x="164" y="47" font-size="13" font-weight="600" fill="#704700">HOW THE PARTS FIT</text>
<text x="76" y="66" font-size="12" fill="#453f3b">One lead thread, a checked party, and the decisions kept with you</text>
