<text x="78" y="317" font-size="15" font-weight="700" fill="#282828">KEEPER</text>
<rect x="146" y="301" width="92" height="20" fill="#dfd4bf"/><text x="192.0" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#754f11">lead thread</text>
<text x="78" y="335" font-size="11.5" fill="#554f48">Holds quests, delegates by default</text>
<line x1="40" y1="348" x2="378" y2="348" stroke="#b7ae96" stroke-width="1"/>
<text x="40" y="370" font-size="12" fill="#282828">■ Routes chat: steer, question, aside, rule</text>
