<text x="36" y="539" font-size="12" font-weight="700" fill="#076678" letter-spacing="0.6">THE PARTY · HIRED CLASSES</text>
<text x="724" y="539" text-anchor="end" font-size="11.5" fill="#554f48">Each class brings its own role, tools and scope</text>
