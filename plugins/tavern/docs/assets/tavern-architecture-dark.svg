<text x="712" y="583" text-anchor="end" font-size="11" font-weight="700" fill="#b9aa93">2. BUILD</text>
<text x="400" y="608" font-size="11.5" fill="#ccbfa0">Edits on a branch, commits work,</text>
<text x="400" y="626" font-size="11.5" fill="#ccbfa0">runs checks, opens draft PRs</text>
