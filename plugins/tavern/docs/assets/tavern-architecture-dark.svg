<text x="40" y="414" font-size="12" fill="#ebdbb2">■ Hires party with verbatim user wording</text>
<text x="40" y="436" font-size="12" fill="#ebdbb2">■ Makes reversible calls (Decided for you)</text>
<text x="40" y="458" font-size="12" fill="#ebdbb2">■ Refreshes context or spawns child leads</text>
