<text x="36" y="817" font-size="12" font-weight="700" fill="#fe8019" letter-spacing="0.5">SCOPES AND GUARDRAILS</text>
<text x="36" y="846" font-size="11.5" fill="#ebdbb2">■ Pi guard shim: pre-exec and OS sandbox</text>
<text x="36" y="866" font-size="11.5" fill="#ccbfa0">■ Non-Pi or remote: detection-only watch</text>
<text x="36" y="886" font-size="11.5" fill="#ccbfa0">■ Send guard: agents draft, you send</text>
<text x="36" y="906" font-size="11.5" fill="#ccbfa0">■ Cluster writes: approve then confirm</text>
<text x="36" y="926" font-size="11.5" fill="#ccbfa0">■ Policy: ~/.agents/tavern/scopes.yml</text>
<rect x="388" y="800" width="348" height="144" fill="#3c3836" stroke="#e5b1b2" stroke-width="1.5"/>
<rect x="388" y="800" width="348" height="24" fill="#47393b"/>
<line x1="388" y1="824" x2="736" y2="824" stroke="#504945" stroke-width="1"/>
<text x="400" y="817" font-size="12" font-weight="700" fill="#e5b1b2" letter-spacing="0.5">WHERE WORK RUNS · HOST WORKER</text>
<text x="400" y="846" font-size="11.5" fill="#ebdbb2">■ Local linked git worktrees by default</text>
<text x="400" y="866" font-size="11.5" fill="#ccbfa0">■ Machine rules place work on bb hosts</text>
<text x="400" y="886" font-size="11.5" fill="#ccbfa0">■ Clean Git snapshots (home untouched)</text>
<text x="400" y="906" font-size="11.5" fill="#ccbfa0">■ Forge profiles open draft PRs at home</text>
<text x="400" y="926" font-size="11.5" fill="#ccbfa0">■ Work preserved before member release</text>
