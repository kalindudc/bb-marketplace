<rect x="146" y="301" width="92" height="20" fill="#4d4330"/><text x="192.0" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#fabd2f">lead thread</text>
<text x="78" y="335" font-size="11.5" fill="#b9aa93">Holds quests, delegates by default</text>
<line x1="40" y1="348" x2="378" y2="348" stroke="#504945" stroke-width="1"/>
<text x="40" y="370" font-size="12" fill="#ebdbb2">■ Routes chat: steer, question, aside, rule</text>
