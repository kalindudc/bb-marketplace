<text x="360" y="691" text-anchor="end" font-size="11" font-weight="700" fill="#b9aa93">3. VERIFY</text>
<text x="48" y="716" font-size="11.5" fill="#ccbfa0">Separate model family in clean</text>
<text x="48" y="734" font-size="11.5" fill="#ccbfa0">context; verifies or rejects work</text>
